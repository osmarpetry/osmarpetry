name: Update README

on:
  push:
  workflow_dispatch:
  schedule:
    # Keep repositories, books, and blog posts up to date daily.
    - cron: "0 6 * * *"

jobs:
  readme-scribe:
    # Dependabot cannot access repository secrets, so skip these runs.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"

      # Build markscribe from source instead of using the old Docker image.
      # This preserves HTML comments in the generated README.
      - run: go install github.com/muesli/markscribe@d838b6e71dc673e8a3ef248b0e75fbd44ce8cc4c

      - run: markscribe -write README.md templates/readme.md.tpl
        env:
          # Personal GitHub token used by markscribe to access GitHub data.
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      # Branch builds validate the render but must not touch main: this action
      # pushes to `branch: main` from whatever ref is checked out.
      - uses: stefanzweifel/git-auto-commit-action@v7
        if: github.ref == 'refs/heads/main'
        with:
          commit_message: "docs: update generated README"
          branch: main
          commit_user_name: readme-scribe 🤖
          commit_user_email: actions@github.com
          commit_author: readme-scribe 🤖 <actions@github.com>
