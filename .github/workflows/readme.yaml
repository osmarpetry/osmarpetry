name: Update README

on:
  push:
  workflow_dispatch:
  schedule:
    # Daily, so the repos, books and blog posts stay current without you touching it.
    - cron: "0 6 * * *"

jobs:
  readme-scribe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"

      # muesli/readme-scribe@master runs docker://fribbledom/markscribe, an
      # image frozen since 2021 that strips HTML comments from the output, so
      # the "do not edit README.md" footer never survives. Build markscribe
      # from source instead, pinned to the last commit on master.
      - run: go install github.com/muesli/markscribe@d838b6e71dc673e8a3ef248b0e75fbd44ce8cc4c

      - run: markscribe -write README.md templates/readme.md.tpl
        env:
          # A classic PAT with `public_repo` and `read:user`. The default
          # GITHUB_TOKEN cannot read your cross-repository contributions.
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      # Branch builds validate the render but must not touch main: this action
      # pushes to `branch: main` from whatever ref is checked out.
      - uses: stefanzweifel/git-auto-commit-action@v7
        if: github.ref == 'refs/heads/main'
        with:
          commit_message: "docs: update generated README"
          branch: main
          commit_user_name: readme-scribe 🤖
          commit_user_email: actions@github.com
          commit_author: readme-scribe 🤖 <actions@github.com>
